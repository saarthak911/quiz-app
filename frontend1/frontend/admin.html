<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradebook &mdash; Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="brand">grade<span>book</span></div>
    <nav id="appNav"></nav>
  </header>

  <h1>Admin</h1>
  <div id="alertBox"></div>

  <!-- Create quiz -->
  <div class="card">
    <h2>Create a quiz</h2>
    <form id="createQuizForm">
      <label for="title">Title</label>
      <input type="text" id="title" required>

      <label for="description">Description</label>
      <textarea id="description"></textarea>

      <label for="duration">Duration (minutes)</label>
      <input type="number" id="duration" min="1" value="10" required>

      <button type="submit">Create quiz</button>
    </form>
  </div>

  <!-- Add questions -->
  <div class="card">
    <h2>Add a question</h2>
    <label for="quizSelect">Quiz</label>
    <select id="quizSelect" style="width:100%; padding:10px; border:1px solid var(--paper-line); border-radius:2px; background:var(--paper);"></select>

    <form id="addQuestionForm">
      <label for="questionText">Question</label>
      <textarea id="questionText" required></textarea>

      <label for="optionA">Option A</label>
      <input type="text" id="optionA" required>
      <label for="optionB">Option B</label>
      <input type="text" id="optionB" required>
      <label for="optionC">Option C</label>
      <input type="text" id="optionC" required>
      <label for="optionD">Option D</label>
      <input type="text" id="optionD" required>

      <label for="correctOption">Correct option</label>
      <select id="correctOption" style="width:100%; padding:10px; border:1px solid var(--paper-line); border-radius:2px; background:var(--paper);">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>

      <button type="submit">Add question</button>
    </form>
  </div>

  <!-- Suggested videos -->
  <div class="card">
    <h2>Suggested videos</h2>
    <p class="muted">YouTube links shown on the result page to students who score below the threshold.</p>

    <label for="resQuizSelect">Quiz</label>
    <select id="resQuizSelect" style="width:100%; padding:10px; border:1px solid var(--paper-line); border-radius:2px; background:var(--paper);"></select>

    <div class="inline-row">
      <div>
        <label for="thresholdInput">Show videos when score is below (%)</label>
        <input type="number" id="thresholdInput" min="0" max="100" value="50">
      </div>
      <button type="button" id="saveThresholdBtn" class="secondary">Save</button>
    </div>
    <p class="muted" style="margin-top:6px;">0 turns suggestions off. 100 shows them to everyone who doesn't get full marks.</p>

    <form id="addResourceForm">
      <label for="resTitle">Video title</label>
      <input type="text" id="resTitle" maxlength="150" required>
      <label for="resUrl">YouTube link</label>
      <input type="text" id="resUrl" placeholder="https://www.youtube.com/watch?v=..." required>
      <button type="submit">Add video</button>
    </form>

    <div id="resourceList" style="margin-top:18px;"></div>
  </div>

  <!-- Results -->
  <div class="card">
    <h2>Results</h2>
    <label for="resultsQuizSelect">Quiz</label>
    <select id="resultsQuizSelect" style="width:100%; padding:10px; border:1px solid var(--paper-line); border-radius:2px; background:var(--paper);"></select>
    <div id="resultsTable"></div>
  </div>
</div>

<script src="api.js"></script>
<script>
  Auth.requireAdmin();
  renderNav();

  let quizzes = [];

  async function loadQuizzes() {
    quizzes = await apiCall('/quizzes');
    const options = quizzes.map(q => `<option value="${q.id}">${escapeHtml(q.title)}</option>`).join('');
    document.getElementById('quizSelect').innerHTML = options || '<option value="">No quizzes yet</option>';
    document.getElementById('resultsQuizSelect').innerHTML = options || '<option value="">No quizzes yet</option>';
    document.getElementById('resQuizSelect').innerHTML = options || '<option value="">No quizzes yet</option>';
    if (quizzes.length) { loadResults(); loadResources(); }
  }

  document.getElementById('createQuizForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert('alertBox');
    try {
      await apiCall('/admin/quizzes', {
        method: 'POST',
        body: {
          title: document.getElementById('title').value.trim(),
          description: document.getElementById('description').value.trim(),
          durationMinutes: parseInt(document.getElementById('duration').value, 10)
        }
      });
      document.getElementById('createQuizForm').reset();
      document.getElementById('duration').value = 10;
      showAlert('alertBox', 'Quiz created.', 'success');
      await loadQuizzes();
    } catch (err) {
      showAlert('alertBox', err.message);
    }
  });

  document.getElementById('addQuestionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert('alertBox');
    const quizId = document.getElementById('quizSelect').value;
    if (!quizId) {
      showAlert('alertBox', 'Create a quiz first.');
      return;
    }
    try {
      await apiCall(`/admin/quizzes/${quizId}/questions`, {
        method: 'POST',
        body: {
          questionText: document.getElementById('questionText').value.trim(),
          optionA: document.getElementById('optionA').value.trim(),
          optionB: document.getElementById('optionB').value.trim(),
          optionC: document.getElementById('optionC').value.trim(),
          optionD: document.getElementById('optionD').value.trim(),
          correctOption: document.getElementById('correctOption').value
        }
      });
      document.getElementById('addQuestionForm').reset();
      showAlert('alertBox', 'Question added.', 'success');
      await loadQuizzes();
    } catch (err) {
      showAlert('alertBox', err.message);
    }
  });

  document.getElementById('resultsQuizSelect').addEventListener('change', loadResults);

  async function loadResults() {
    const quizId = document.getElementById('resultsQuizSelect').value;
    const tableEl = document.getElementById('resultsTable');
    if (!quizId) { tableEl.innerHTML = ''; return; }
    try {
      const results = await apiCall(`/admin/quizzes/${quizId}/results`);
      if (!results.length) {
        tableEl.innerHTML = '<p class="muted">No attempts yet.</p>';
        return;
      }
      tableEl.innerHTML = `
        <table>
          <thead><tr><th>Student</th><th>Score</th><th>Started</th><th>Submitted</th></tr></thead>
          <tbody>
            ${results.map(r => `
              <tr>
                <td>${escapeHtml(r.username)}</td>
                <td>${r.submittedAt ? r.score : '&mdash; (in progress)'}</td>
                <td>${new Date(r.startedAt).toLocaleString()}</td>
                <td>${r.submittedAt ? new Date(r.submittedAt).toLocaleString() : '&mdash;'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      showAlert('alertBox', err.message);
    }
  }

  // ---------- Suggested videos ----------
  document.getElementById('resQuizSelect').addEventListener('change', loadResources);

  async function loadResources() {
    const quizId = document.getElementById('resQuizSelect').value;
    const listEl = document.getElementById('resourceList');
    listEl.innerHTML = '';
    if (!quizId) return;
    try {
      const data = await apiCall(`/admin/quizzes/${quizId}/resources`);
      document.getElementById('thresholdInput').value = data.thresholdPercent;
      if (!data.resources.length) {
        listEl.innerHTML = '<p class="muted">No videos added for this quiz yet.</p>';
        return;
      }
      data.resources.forEach(r => {
        const row = document.createElement('div');
        row.className = 'resource-row';

        const link = document.createElement('a');
        link.href = r.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = r.title;

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'secondary';
        del.textContent = 'Delete';
        del.addEventListener('click', () => deleteResource(quizId, r.id));

        row.appendChild(link);
        row.appendChild(del);
        listEl.appendChild(row);
      });
    } catch (err) {
      showAlert('alertBox', err.message);
    }
  }

  document.getElementById('addResourceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert('alertBox');
    const quizId = document.getElementById('resQuizSelect').value;
    if (!quizId) { showAlert('alertBox', 'Create a quiz first.'); return; }
    try {
      await apiCall(`/admin/quizzes/${quizId}/resources`, {
        method: 'POST',
        body: {
          title: document.getElementById('resTitle').value.trim(),
          url: document.getElementById('resUrl').value.trim()
        }
      });
      document.getElementById('addResourceForm').reset();
      showAlert('alertBox', 'Video added.', 'success');
      loadResources();
    } catch (err) {
      showAlert('alertBox', err.message);
    }
  });

  async function deleteResource(quizId, resourceId) {
    clearAlert('alertBox');
    try {
      await apiCall(`/admin/quizzes/${quizId}/resources/${resourceId}`, { method: 'DELETE' });
      loadResources();
    } catch (err) {
      showAlert('alertBox', err.message);
    }
  }

  document.getElementById('saveThresholdBtn').addEventListener('click', async () => {
    clearAlert('alertBox');
    const quizId = document.getElementById('resQuizSelect').value;
    if (!quizId) return;
    const percent = parseInt(document.getElementById('thresholdInput').value, 10);
    if (isNaN(percent) || percent < 0 || percent > 100) {
      showAlert('alertBox', 'Threshold must be between 0 and 100.');
      return;
    }
    try {
      await apiCall(`/admin/quizzes/${quizId}/suggestion-threshold`, { method: 'PUT', body: { percent } });
      showAlert('alertBox', 'Threshold saved.', 'success');
    } catch (err) {
      showAlert('alertBox', err.message);
    }
  });

  loadQuizzes();
</script>
</body>
</html>
