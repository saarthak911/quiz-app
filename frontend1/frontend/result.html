<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradebook &mdash; Result</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="brand">grade<span>book</span></div>
    <nav id="appNav"></nav>
  </header>

  <div class="card score-banner" id="scoreBanner"></div>

  <div id="suggestionBox"></div>

  <h2>Answer review</h2>
  <div id="reviewList" class="card"></div>

  <a href="dashboard.html" class="btn">Back to quizzes</a>
</div>

<script src="api.js"></script>
<script>
  Auth.requireLogin();
  renderNav();

  const result = JSON.parse(sessionStorage.getItem('last_result') || 'null');

  if (!result) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('scoreBanner').innerHTML = `
    <div class="big-score">${result.score} / ${result.totalQuestions}</div>
    <div class="of">${Math.round((result.score / result.totalQuestions) * 100)}% correct</div>
  `;

  // Suggested videos: the server only includes them when this student's score is
  // below the quiz's threshold, so an empty list simply means "nothing to show".
  // Links are built with DOM APIs (not innerHTML) so titles/URLs can never inject markup.
  (function renderSuggestions() {
    const box = document.getElementById('suggestionBox');
    const items = result.suggestions || [];
    if (!items.length) return;

    const wrap = document.createElement('div');
    wrap.className = 'suggestion-box';

    const h = document.createElement('h2');
    h.textContent = 'Suggested for you';
    wrap.appendChild(h);

    const intro = document.createElement('p');
    intro.className = 'muted';
    intro.textContent = `You scored below ${result.suggestionThresholdPercent}% on this quiz. ` +
      'These videos from your instructor can help you revise before trying again:';
    wrap.appendChild(intro);

    const ul = document.createElement('ul');
    ul.className = 'suggestion-list';
    items.forEach(item => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      const play = document.createElement('span');
      play.className = 'play';
      play.textContent = '\u25B6';
      const label = document.createElement('span');
      label.textContent = item.title;
      a.appendChild(play);
      a.appendChild(label);
      li.appendChild(a);
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    box.appendChild(wrap);
  })();

  document.getElementById('reviewList').innerHTML = result.review.map((r, idx) => `
    <div class="question-block">
      <div class="question-number">Question ${idx + 1}</div>
      <h3>${escapeHtml(r.questionText)}</h3>
      <p style="margin: 6px 0;">
        Your answer:
        <strong style="color: ${r.correct ? 'var(--green-check)' : 'var(--red-pencil)'};">
          ${r.selectedOption || '(left blank)'}
        </strong>
        ${r.correct ? '&check; correct' : `&mdash; correct answer was <strong>${r.correctOption}</strong>`}
      </p>
    </div>
  `).join('');
</script>
</body>
</html>
