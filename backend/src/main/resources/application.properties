spring.application.name=quiz-app

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/quizdb
spring.datasource.username=postgres
spring.datasource.password=0911

# --- JPA / Hibernate ---
# ddl-auto=update auto-creates/updates tables from the entities below.
# Switch to "validate" once your schema is stable, and use schema.sql for real migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server ---
server.port=8081

# --- JWT ---
# Change this secret before deploying anywhere real. Must be at least 256 bits for HS256.
app.jwt.secret=change-this-to-a-long-random-secret-value-before-deploying-anywhere-real
app.jwt.expiration-ms=86400000
